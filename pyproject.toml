[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "pristupny-ovladac-listu-excelu"
version = "0.1.0"
description = "Přístupný ovladač listů Excelu (PyQt6 + COM)"
requires-python = ">=3.11"
dependencies = [
  "PyQt6>=6.6",
  "pywin32>=306; sys_platform=='win32'",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
